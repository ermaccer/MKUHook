name: Build MKUHook

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # استخدام حاوية تحتوي على أدوات مترجم PSP SDK جاهزة ومثبتة مسبقاً
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          cd MKUHook
          make -j$(nproc)

      - name: Prepare Release Files
        run: |
          mkdir -p release_folder
          find MKUHook -name "*.prx" -exec cp {} release_folder/ \;
          find . -name "*.ini" -exec cp {} release_folder/ \;

      - name: Create Artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MKUHook-Release
          path: release_folder/
          
