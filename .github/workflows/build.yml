name: Build MKUHook

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PSP Development Environment
        run: |
          echo "Updating package list..."
          sudo apt-get update
          
          echo "Installing build dependencies and PSP toolchain prerequisites..."
          sudo apt-get install -y build-essential cmake git wget libreadline-dev libncurses5-dev zlib1g-dev libsdl1.2-dev

      - name: Build Project
        run: |
          echo "Starting build process..."
          make -j$(nproc)

      - name: Prepare Release Files
        run: |
          echo "Organizing built files..."
          mkdir -p release_folder
          
          # نسخ ملفات الـ PRX والـ INI الناتجة
          find . -name "*.prx" -exec cp {} release_folder/ \;
          find . -name "*.ini" -exec cp {} release_folder/ \;

      - name: Create Artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MKUHook-Release
          path: release_folder/
          
